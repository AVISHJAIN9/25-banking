services:
  - type: web
    name: aj-banking
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: 31-banking/backend banking
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: REFRESH_TOKEN
        sync: false
      - key: EMAIL_USER
        sync: false
